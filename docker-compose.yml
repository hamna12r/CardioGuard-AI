version: '3.8'

services:
  cardioguard-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardioguard-ai:latest
    container_name: cardioguard-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=False
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
